# Prometheus configuration for GPU Sentinel.
# Collection intervals are deliberately modest (15s) — enough for performance
# diagnosis without loading production nodes. DCGM profiling metrics are
# the most expensive; keep them ≥ 10s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Demo / GITEX: the cluster simulator exposes DCGM + node_exporter + workload metrics.
  - job_name: sentinel-simulator
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets: ["simulator:9400"]

  # --- GPU Sentinel's own health metrics
  - job_name: sentinel-backend
    static_configs:
      - targets: ["backend:8000"]

  # --- Production examples (uncomment and adapt) -----------------------------
  # NVIDIA DCGM exporter (DaemonSet or systemd on every GPU node, port 9400).
  # - job_name: dcgm
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ["gpu-node-01:9400", "gpu-node-02:9400"]
  #   relabel_configs:
  #     # GPU Sentinel expects a `node` label on every series.
  #     - source_labels: [Hostname]
  #       target_label: node
  #
  # Prometheus node_exporter with the infiniband & pressure collectors enabled.
  # - job_name: node
  #   static_configs:
  #     - targets: ["gpu-node-01:9100", "gpu-node-02:9100"]
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       regex: "([^:]+):.*"
  #       target_label: node
