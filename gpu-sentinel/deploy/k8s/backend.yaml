# Single replica: the analysis engine is a singleton in the MVP (see docs §9 for HA plan).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: sentinel-backend }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: sentinel-backend } }
  template:
    metadata:
      labels: { app: sentinel-backend }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: gpu-sentinel/backend
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: sentinel-backend }
  ports: [{ port: 8000, targetPort: http, name: http }]
