[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servebench"
version = "0.1.0"
description = "Load-testing, agent-latency and profiling harness for vLLM on NVIDIA DGX Spark (GB10)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
mock = ["starlette>=0.37", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "starlette>=0.37", "uvicorn>=0.29"]

[project.scripts]
servebench = "servebench.cli:main"

[tool.setuptools.packages.find]
include = ["servebench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
