# Shared settings for every experiment. Each experiment `extends: base.yaml`
# and overrides ONLY the knobs it is testing, so before/after is apples-to-apples.
model: Qwen/Qwen3-8B            # Apache-2.0, ungated, native tool calling
served_model_name: qwen3-8b     # constant across experiments so clients never change
description: ""
changes: []

docker:
  # Override with VLLM_IMAGE=... (e.g. an NGC nvcr.io/nvidia/vllm:<yy.mm>-py3 tag built for DGX Spark).
  image: vllm/vllm-openai:v0.31.0
  env: {}
  extra_args: []

# Rendered to `vllm serve` flags: true -> --flag, false -> --no-flag, value -> --flag value
server:
  max-model-len: 32768
  # GB10 has 128 GB *unified* LPDDR5x shared with the OS/CPU; leave headroom.
  gpu-memory-utilization: 0.65
  max-num-seqs: 128
  max-num-batched-tokens: 2048   # chunked-prefill token budget per engine step
  enable-prefix-caching: false   # vLLM v1 enables it by default; baseline turns it OFF
  kv-cache-dtype: auto           # = bf16 for this model
  enable-auto-tool-choice: true  # needed by the react agent
  tool-call-parser: hermes       # Qwen3 tool-call format
  enable-prompt-tokens-details: true  # report cached_tokens per request

startup_timeout_s: 1800

slo:
  ttft_ms: 2000
  tpot_ms: 150

# Qwen3 "thinking" would add hundreds of hidden tokens; disable for latency work.
_no_thinking: &no_thinking
  chat_template_kwargs: {enable_thinking: false}

workloads:
  - name: chat                  # unique prompts: pure prefill/decode cost, no cache help
    kind: random
    input_tokens: 512
    input_jitter: 0.25
    output_tokens: 128
    extra_body: *no_thinking
    sweep: {mode: concurrency, levels: [1, 4, 16, 64], requests_per_level: 32}
  - name: rag_shared_prefix     # 4 x 2k-token shared contexts + short unique question
    kind: shared_prefix
    shared_prefix_tokens: 2048
    num_prefixes: 4
    input_tokens: 128
    output_tokens: 128
    extra_body: *no_thinking
    sweep: {mode: concurrency, levels: [1, 8, 32], requests_per_level: 32}
  - name: long_context          # 12k-token documents: KV capacity / context-limit stress
    kind: long_context
    input_tokens: 12000
    output_tokens: 64
    extra_body: *no_thinking
    sweep: {mode: concurrency, levels: [1, 4, 8], requests_per_level: 16}

agent:
  - mode: replay                # fixed-shape trajectory -> comparable latency
    sessions: 1
    episodes_per_session: 5
    replay_steps: 6
    system_prompt_tokens: 2000
    step_output_tokens: 64
    tool_output_tokens: 300
    final_output_tokens: 128
    extra_body: *no_thinking
  - mode: replay
    sessions: 8
    episodes_per_session: 3
    replay_steps: 6
    system_prompt_tokens: 2000
    step_output_tokens: 64
    tool_output_tokens: 300
    final_output_tokens: 128
    extra_body: *no_thinking
  - mode: react                 # real tool calls; also measures task success
    sessions: 4
    episodes_per_session: 5
    max_steps: 6
    system_prompt_tokens: 2000
    max_tokens_per_step: 512
    tool_latency_ms: 50
    extra_body: *no_thinking

profile:
  enabled: true
  workload: chat
  concurrency: 8
  requests: 16
  # Passed into --profiler-config (vLLM 0.31 ProfilerConfig); keeps traces small.
  profiler_config:
    torch_profiler_with_stack: false
    ignore_frontend: true
    delay_iterations: 20
    max_iterations: 60

# Extra flags for the simulator only (--launcher mock), e.g. {sim-mem-bw-gbs: 273}.
# SERVEBENCH_MOCK_TIME_SCALE=0.05 speeds simulated time up for CI smoke tests.
mock: {}
