# Air-gapped AI stack for NVIDIA DGX Spark (linux/arm64, GB10 GPU).
#
#   ollama     - local LLM + embedding server on the GPU      (backend only)
#   chromadb   - vector database for rag-api                 (backend only)
#   rag-api    - small FastAPI RAG service: ingest + query    (backend + frontend)
#   open-webui - chat UI, also does document RAG on its own   (backend + frontend)
#
# "backend" is an internal Docker network: containers on it have no route out
# of the host at all. Only the two user-facing services join "frontend", which
# is what lets Docker publish their ports — and they publish on ${BIND_ADDR}.

name: airgap-ai

networks:
  backend:
    internal: true
  frontend: {}

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    container_name: airgap-ollama
    restart: unless-stopped
    networks: [backend]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ./data/ollama:/root/.ollama
    # GB10 shares one memory pool between CPU and GPU, and CUDA pins host memory.
    # Docker's default 8 MB memlock makes CUDA init fail with "out of memory"
    # and Ollama silently falls back to CPU. Same settings NVIDIA uses for NGC.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  chromadb:
    image: chromadb/chroma:${CHROMA_VERSION}
    container_name: airgap-chromadb
    restart: unless-stopped
    networks: [backend]
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ./data/chroma:/data

  rag-api:
    image: airgap/rag-api:local
    build:
      context: ./rag-api
      args:
        CHROMA_VERSION: ${CHROMA_VERSION}
    container_name: airgap-rag-api
    restart: unless-stopped
    networks: [backend, frontend]
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      OLLAMA_URL: http://ollama:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-oss:20b}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RAG_API_PORT:-8000}:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION}
    container_name: airgap-open-webui
    restart: unless-stopped
    networks: [backend, frontend]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "True"
      DEFAULT_MODELS: ${DEFAULT_CHAT_MODEL:-gpt-oss:20b}
      # --- never reach for the internet ---
      OFFLINE_MODE: "True"
      HF_HUB_OFFLINE: "1"
      ENABLE_OPENAI_API: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      WHISPER_MODEL_AUTO_UPDATE: "False"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
      # --- document RAG uses the local Ollama embedding model, not a HF download ---
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      RAG_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data/open-webui:/app/backend/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
