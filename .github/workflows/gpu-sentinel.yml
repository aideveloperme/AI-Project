name: gpu-sentinel
on:
  push:
    paths: ["gpu-sentinel/**", ".github/workflows/gpu-sentinel.yml"]
  pull_request:
    paths: ["gpu-sentinel/**", ".github/workflows/gpu-sentinel.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gpu-sentinel/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: gpu-sentinel/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check sentinel tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gpu-sentinel/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: gpu-sentinel/frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env: { NODE_ENV: production }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f gpu-sentinel/docker-compose.yml config -q
